<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200"
  height="630">
  <!--
    Source of og-image.png, the social share preview (not published). A static
    variant of partials/empty-illustration.vto beside the app name, with the
    light theme tokens from styles.css. Render it with Nunito installed, since
    the text is not converted to paths.
  -->
  <defs>
    <radialGradient id="glow-1" cx="0" cy="-0.1" r="1">
      <stop offset="0" stop-color="#dcf2ec" />
      <stop offset="0.7" stop-color="#dcf2ec" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-2" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#ffeade" />
      <stop offset="0.7" stop-color="#ffeade" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#f3f7f6" />
  <rect width="1200" height="630" fill="url(#glow-1)" />
  <rect width="1200" height="630" fill="url(#glow-2)" />

  <g font-family="Nunito" fill="#1c2b30" transform="translate(0 44)">
    <rect x="80" y="96" width="88" height="88" rx="18" fill="#9fded0" />
    <g transform="translate(94 94) scale(2.5)" fill="none" stroke="#1c2b30"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
      <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
    </g>

    <text x="76" y="290" font-size="76" font-weight="800"
      letter-spacing="-1">Subscriptions</text>
    <text x="76" y="372" font-size="76" font-weight="800"
      letter-spacing="-1">Tracker</text>

    <text x="80" y="440" font-size="30" font-weight="600"
      fill="#4f6268">Keep track of your subscription fees</text>
    <text x="80" y="480" font-size="30" font-weight="600"
      fill="#4f6268">and have some math done for you.</text>
  </g>

  <!-- partials/empty-illustration.vto, scaled up, at rest -->
  <g transform="translate(610 90) scale(2.2)">
    <ellipse cx="130" cy="100" rx="104" ry="86" fill="#e0f4ef" />
    <ellipse cx="132" cy="178" rx="64" ry="7" fill="#1c2b30"
      fill-opacity="0.1" />

    <g stroke="#1c2b30" stroke-width="2">
      <rect x="74" y="66" width="120" height="78" rx="14" fill="#ffc9ae"
        transform="rotate(-12 134 105)" />
      <rect x="72" y="70" width="122" height="80" rx="14" fill="#a8e6c9"
        transform="rotate(-5 133 110)" />
      <rect x="70" y="74" width="124" height="80" rx="14" fill="#ffffff" />
    </g>
    <circle cx="95" cy="99" r="11" fill="#cbbcff" />
    <rect x="113" y="92" width="58" height="7" rx="3.5" fill="#dbe6e3" />
    <rect x="113" y="104" width="36" height="6" rx="3" fill="#dbe6e3"
      opacity="0.7" />
    <rect x="84" y="128" width="42" height="14" rx="7" fill="#a8e6c9" />
    <rect x="146" y="128" width="34" height="14" rx="7" fill="#ffe08a" />

    <g font-family="Nunito" font-weight="800" fill="#1c2b30"
      text-anchor="middle">
      <g transform="rotate(8 208 56)">
        <circle cx="208" cy="56" r="18" fill="#ffe08a" stroke="#1c2b30"
          stroke-width="2" />
        <text x="208" y="62.5" font-size="19">€</text>
      </g>
      <g transform="rotate(-8 52 70)">
        <circle cx="52" cy="70" r="11" fill="#f9bcd3" stroke="#1c2b30"
          stroke-width="2" />
        <text x="52" y="74.5" font-size="13">$</text>
      </g>
    </g>

    <path transform="translate(46 132)" fill="#cbbcff"
      d="M0-9C1-3 3-1 9 0C3 1 1 3 0 9C-1 3-3 1-9 0C-3-1-1-3 0-9Z" />
    <path transform="translate(222 118)" fill="#ffc9ae"
      d="M0-7C1-2 2-1 7 0C2 1 1 2 0 7C-1 2-2 1-7 0C-2-1-1-2 0-7Z" />
    <path transform="translate(156 30)" fill="#a8e6c9"
      d="M0-6C1-2 2-1 6 0C2 1 1 2 0 6C-1 2-2 1-6 0C-2-1-1-2 0-6Z" />
  </g>
</svg>
