name: Build & deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 🧪 Run tests
        run: deno task test

      - name: 🏗️ Build static website
        run: deno task build:gh

      - name: 🚀 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🏁 Deploy to GitHub Pages
        id: gh-pages
        uses: actions/deploy-pages@v4
