name: CI & deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, type-check, test & build
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧹 Format & type-check
        run: bun run check

      - name: 🧪 Run unit tests
        run: bun run test

      - name: 🏗️ Build static website
        run: bun run build:gh

      # The site is built once here and handed to the deploy job as an artifact
      - name: 🚀 Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.gh-pages.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: 🏁 Deploy to GitHub Pages
        id: gh-pages
        uses: actions/deploy-pages@v5
