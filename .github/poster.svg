<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="520"
  height="400" role="img" aria-labelledby="title">
  <title
    id="title">Subscriptions Tracker: fanned subscription cards with bouncing coins</title>
  <!--
    Standalone copy of src/_includes/partials/empty-illustration.vto for the
    README: colours (the illo tokens) and animations (the .illo rules in
    src/styles.css) are embedded, since GitHub renders SVGs as images.
    Keep the two in sync when changing the illustration.
  -->
  <style>
  svg {
    --blob: #efe9ff;
    --card: #ffffff;
    --stroke: #2a2433;
    --line: #e6dff0;
    --lav: #cbbcff;
    --mint: #a8e6c9;
    --peach: #ffc9ae;
    --butter: #ffe08a;
    --pink: #f9bcd3;
    --shadow: rgb(42 36 51 / 0.1);
  }

  @media (prefers-color-scheme: dark) {
    svg {
      --blob: #262036;
      --card: #2f2a3b;
      --stroke: #0e0c13;
      --line: #443c54;
      --lav: #9d8ae0;
      --mint: #6fbf9b;
      --peach: #d99a80;
      --butter: #e0bf62;
      --pink: #d48aa7;
      --shadow: rgb(0 0 0 / 0.35);
    }
  }

  * {
    transform-box: fill-box;
    transform-origin: center;
  }

  .blob {
    fill: var(--blob);
    animation: breathe 6s ease-in-out infinite;
  }
  .shadow {
    fill: var(--shadow);
    animation: shadow 4s ease-in-out infinite;
  }
  .stack {
    animation: float 4s ease-in-out infinite;
  }
  .card,
  .card-bg,
  .coin circle {
    stroke: var(--stroke);
    stroke-width: 2;
  }
  .back {
    fill: var(--peach);
    rotate: -12deg;
    animation: sway-back 4s ease-in-out infinite;
  }
  .mid {
    fill: var(--mint);
    rotate: -5deg;
    animation: sway-mid 4s ease-in-out infinite;
  }
  .card-bg {
    fill: var(--card);
  }
  .avatar {
    fill: var(--lav);
  }
  .line {
    fill: var(--line);
  }
  .faint {
    opacity: 0.7;
  }
  .pill {
    fill: var(--mint);
  }
  .price {
    fill: var(--butter);
  }
  .coin circle {
    fill: var(--butter);
  }
  .coin text {
    fill: var(--stroke);
    font-family: "Nunito", ui-rounded, system-ui, sans-serif;
    font-size: 19px;
    font-weight: 800;
  }
  .coin-big {
    animation: coin 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }
  .coin-small {
    animation: coin 3.2s cubic-bezier(0.22, 1, 0.36, 1) 0.8s infinite;
  }
  .coin-small circle {
    fill: var(--pink);
  }
  .coin-small text {
    font-size: 13px;
  }
  .sparkle {
    fill: var(--lav);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  .sparkle-2 {
    fill: var(--peach);
    animation-delay: 0.8s;
  }
  .sparkle-3 {
    fill: var(--mint);
    animation-delay: 1.6s;
  }

  @keyframes float {
    50% {
      translate: 0 -7px;
    }
  }
  @keyframes shadow {
    50% {
      scale: 0.86 1;
      opacity: 0.7;
    }
  }
  @keyframes breathe {
    50% {
      scale: 1.04;
    }
  }
  @keyframes sway-back {
    50% {
      rotate: -16deg;
    }
  }
  @keyframes sway-mid {
    50% {
      rotate: -8deg;
    }
  }
  @keyframes coin {
    0%,
    100% {
      translate: 0 0;
      rotate: -8deg;
    }
    45% {
      translate: 0 -14px;
      rotate: 10deg;
    }
  }
  @keyframes twinkle {
    0%,
    100% {
      scale: 0.4;
      opacity: 0.35;
    }
    50% {
      scale: 1;
      opacity: 1;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
    }
  }
  </style>

  <ellipse class="blob" cx="130" cy="100" rx="104" ry="86" />
  <ellipse class="shadow" cx="132" cy="178" rx="64" ry="7" />

  <g class="stack">
    <rect class="card back" x="74" y="66" width="120" height="78" rx="14" />
    <rect class="card mid" x="72" y="70" width="122" height="80" rx="14" />
    <g class="front">
      <rect class="card-bg" x="70" y="74" width="124" height="80" rx="14" />
      <circle class="avatar" cx="95" cy="99" r="11" />
      <rect class="line" x="113" y="92" width="58" height="7" rx="3.5" />
      <rect class="line faint" x="113" y="104" width="36" height="6" rx="3" />
      <rect class="pill" x="84" y="128" width="42" height="14" rx="7" />
      <rect class="price" x="146" y="128" width="34" height="14" rx="7" />
    </g>
  </g>

  <g class="coin coin-big">
    <circle cx="208" cy="56" r="18" />
    <text x="208" y="62.5" text-anchor="middle">€</text>
  </g>
  <g class="coin coin-small">
    <circle cx="52" cy="70" r="11" />
    <text x="52" y="74.5" text-anchor="middle">$</text>
  </g>

  <g transform="translate(46 132)">
    <path class="sparkle"
      d="M0-9C1-3 3-1 9 0C3 1 1 3 0 9C-1 3-3 1-9 0C-3-1-1-3 0-9Z" />
  </g>
  <g transform="translate(222 118)">
    <path class="sparkle sparkle-2"
      d="M0-7C1-2 2-1 7 0C2 1 1 2 0 7C-1 2-2 1-7 0C-2-1-1-2 0-7Z" />
  </g>
  <g transform="translate(156 30)">
    <path class="sparkle sparkle-3"
      d="M0-6C1-2 2-1 6 0C2 1 1 2 0 6C-1 2-2 1-6 0C-2-1-1-2 0-6Z" />
  </g>
</svg>
